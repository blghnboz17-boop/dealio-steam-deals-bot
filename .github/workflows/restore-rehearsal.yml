name: Offsite restore rehearsal
on:
  workflow_dispatch:
  schedule:
    - cron: '47 5 1 * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: restore-rehearsal
  cancel-in-progress: false
jobs:
  restore:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Find most recent completed backup
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=$(gh run list --workflow offsite-backup.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8.0.1
        with:
          name: dealio-encrypted-backup
          path: ${{ runner.temp }}/recovery
          github-token: ${{ github.token }}
          run-id: ${{ steps.latest.outputs.run_id }}
      - run: npm ci
      - run: npm run build
      - name: Decrypt, verify integrity and migrate an isolated copy
        env:
          DEALIO_BACKUP_PRIVATE_KEY: ${{ secrets.DEALIO_BACKUP_PRIVATE_KEY }}
        run: node scripts/restore-encrypted-backup.mjs "$RUNNER_TEMP/recovery/wishlist.encrypted.json" > "$RUNNER_TEMP/restore-evidence.json"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: restore-evidence
          path: ${{ runner.temp }}/restore-evidence.json
          retention-days: 35
          if-no-files-found: error
      - name: Confirm successful recovery
        env:
          RESTORE_PING_URL: ${{ secrets.HEALTHCHECKS_RESTORE_PING_URL }}
        run: curl --fail --silent --show-error --max-time 15 --retry 2 --output /dev/null "$RESTORE_PING_URL"
      - name: Report failure
        if: failure()
        env:
          RESTORE_PING_URL: ${{ secrets.HEALTHCHECKS_RESTORE_PING_URL }}
        run: curl --fail --silent --show-error --max-time 15 --output /dev/null "$RESTORE_PING_URL/fail"
