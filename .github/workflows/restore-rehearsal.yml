name: Offsite restore rehearsal
on:
  workflow_dispatch:
  schedule:
    - cron: '47 5 1 * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: restore-rehearsal
  cancel-in-progress: false
jobs:
  restore:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Find most recent completed backup
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=$(gh run list --workflow offsite-backup.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dealio-encrypted-backup
          path: ${{ runner.temp }}/recovery
          github-token: ${{ github.token }}
          run-id: ${{ steps.latest.outputs.run_id }}
      # No dependency install scripts in the job that later holds the private key.
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Decrypt, verify integrity and migrate an isolated copy
        env:
          DEALIO_BACKUP_PRIVATE_KEY: ${{ secrets.DEALIO_BACKUP_PRIVATE_KEY }}
        run: node scripts/restore-encrypted-backup.mjs "$RUNNER_TEMP/recovery/wishlist.encrypted.json" > "$RUNNER_TEMP/restore-evidence.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: restore-evidence
          path: ${{ runner.temp }}/restore-evidence.json
          retention-days: 35
          if-no-files-found: error
      - name: Confirm successful recovery
        env:
          RESTORE_PING_URL: ${{ secrets.HEALTHCHECKS_RESTORE_PING_URL }}
        run: curl --fail --silent --show-error --max-time 15 --retry 2 --output /dev/null "$RESTORE_PING_URL"
      - name: Report failure
        if: failure()
        env:
          RESTORE_PING_URL: ${{ secrets.HEALTHCHECKS_RESTORE_PING_URL }}
        run: curl --fail --silent --show-error --max-time 15 --output /dev/null "$RESTORE_PING_URL/fail"
